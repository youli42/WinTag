[package]
name = "wintag"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
anyhow = "1"
thiserror = "1"

[dependencies.egui]
version = "0.31"

[dependencies.winit]
version = "0.30"

[dependencies.eframe]
version = "0.31"
default-features = false
features = ["default"]